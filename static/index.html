        async function loadGames() {
            const { date } = getFilters();
            if (!date) { document.getElementById('games-results').innerHTML = '<div class="col-span-full text-center text-gray-400 py-8">Select a date to view games</div>'; return; }
            
            const [data, oddsData, intelData] = await Promise.all([
                fetchAPI(`/fanmatch?date=${date}`),
                fetchAPI(`/odds?date=${date}`).catch(() => []),
                fetchAPI(`/game-intel?date=${date}`).catch(() => [])
            ]);
            const container = document.getElementById('games-results');
            
            if (data.error) {
                const msg = data.error.includes('400') || data.error.includes('Bad Request')
                    ? 'No game data available for this date. KenPom only has data for past dates.'
                    : data.error;
                container.innerHTML = `<div class="col-span-full text-center text-red-400 py-8"><i class="fas fa-calendar-times mr-2"></i>${msg}</div>`;
                return;
            }
            if (!Array.isArray(data) || data.length === 0) { container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-8">No games found for this date</div>'; return; }
            
            // Build odds lookup by normalized name
            const oddsMap = {};
            if (Array.isArray(oddsData)) {
                oddsData.forEach(o => {
                    const key = (o.home || '').toLowerCase().replace(/\./g, '').trim() + '|' + (o.away || '').toLowerCase().replace(/\./g, '').trim();
                    const keyFull = (o.home_full || '').toLowerCase().replace(/\./g, '').trim() + '|' + (o.away_full || '').toLowerCase().replace(/\./g, '').trim();
                    oddsMap[key] = o;
                    oddsMap[keyFull] = o;
                });
            }
            // Build intel lookup (line movement + refs)
            const intelMap = {};
            if (Array.isArray(intelData)) {
                intelData.forEach(g => {
                    const key = (g.home || '').toLowerCase().replace(/\./g, '').trim() + '|' + (g.away || '').toLowerCase().replace(/\./g, '').trim();
                    const keyFull = (g.home_full || '').toLowerCase().replace(/\./g, '').trim() + '|' + (g.away_full || '').toLowerCase().replace(/\./g, '').trim();
                    intelMap[key] = g;
                    intelMap[keyFull] = g;
                });
            }
            function findIntel(kpHome, kpVisitor) {
                const nh = kpHome.toLowerCase().replace(/\./g, '').trim();
                const nv = kpVisitor.toLowerCase().replace(/\./g, '').trim();
                let g = intelMap[nh + '|' + nv];
                if (g) return g;
                if (Array.isArray(intelData)) {
                    for (const gi of intelData) {
                        const sh = (gi.home || '').toLowerCase().replace(/\./g, '').trim();
                        const shf = (gi.home_full || '').toLowerCase().replace(/\./g, '').trim();
                        const sa = (gi.away || '').toLowerCase().replace(/\./g, '').trim();
                        const saf = (gi.away_full || '').toLowerCase().replace(/\./g, '').trim();
                        if ((nh.includes(sh) || sh.includes(nh) || nh.includes(shf) || shf.includes(nh)) &&
                            (nv.includes(sa) || sa.includes(nv) || nv.includes(saf) || saf.includes(nv)))
                            return gi;
                    }
                }
                return null;
            }
            function findOdds(kpHome, kpVisitor) {
                const nh = kpHome.toLowerCase().replace(/\./g, '').trim();
                const nv = kpVisitor.toLowerCase().replace(/\./g, '').trim();
                let o = oddsMap[nh + '|' + nv];
                if (o) return o;
                // Partial match
                if (Array.isArray(oddsData)) {
                    for (const od of oddsData) {
                        const sh = (od.home || '').toLowerCase().replace(/\./g, '').trim();
                        const shf = (od.home_full || '').toLowerCase().replace(/\./g, '').trim();
                        const sa = (od.away || '').toLowerCase().replace(/\./g, '').trim();
                        const saf = (od.away_full || '').toLowerCase().replace(/\./g, '').trim();
                        if ((nh.includes(sh) || sh.includes(nh) || nh.includes(shf) || shf.includes(nh)) &&
                            (nv.includes(sa) || sa.includes(nv) || nv.includes(saf) || saf.includes(nv)))
                            return od;
                    }
                }
                return null;
            }
            
            // Pre-compute discrepancy for each game using absolute margins
            const enriched = data.map(g => {
                const odds = findOdds(g.Home || '', g.Visitor || '');
                const kpMargin = Math.abs((g.HomePred || 0) - (g.VisitorPred || 0));
                const vegasMargin = odds ? Math.abs(odds.spread) : null;
                // Check if KenPom and Vegas agree on the favorite
                const kpFavHome = (g.HomePred || 0) > (g.VisitorPred || 0);
                const vegasFavHome = odds ? odds.home_favorite : null;
                const sameSide = odds ? (kpFavHome === vegasFavHome) : null;
                const discrepancy = vegasMargin !== null
                    ? (sameSide ? Math.abs(kpMargin - vegasMargin) : kpMargin + vegasMargin)
                    : -1;
                return { ...g, _odds: odds, _discrepancy: discrepancy, _sameSide: sameSide };
            });
            // Sort: widest discrepancies first; games without odds go last
            const sorted = enriched.sort((a, b) => b._discrepancy - a._discrepancy);
            
            container.innerHTML = sorted.slice(0, 50).map(g => {
                const homeWP = g.HomeWP || 0;
                const visWP = 100 - homeWP;
                const homeFavored = homeWP >= 50;
                const margin = Math.abs(g.HomePred - g.VisitorPred);
                const odds = g._odds;
                const vegasLine = odds ? odds.details : null;
                const vegasSpread = odds ? odds.spread : null;
                const vegasOU = odds ? odds.over_under : null;
                const discrepancy = g._discrepancy;
                const intel = findIntel(g.Home || '', g.Visitor || '');
                const lineMove = intel ? intel.line_movement : null;
                const openSpread = intel ? intel.open_spread : null;
                const officials = intel ? (intel.officials || []) : [];
                const cardId = `game-${(g.Visitor||'').replace(/[^a-zA-Z]/g,'')}-${(g.Home||'').replace(/[^a-zA-Z]/g,'')}`;
                return `
                <div id="${cardId}" class="game-card bg-gray-800 rounded-lg p-4 border border-gray-700 hover:border-orange-500/40 transition-all">
                    <div class="flex items-center justify-between mb-3">
                        <div class="text-center flex-1" data-role="visitor">
                            <p class="text-xs text-gray-500">#${g.VisitorRank || '?'}</p>
                            <p class="font-bold text-sm ${!homeFavored ? 'text-orange-300' : ''}">${g.Visitor || 'TBD'}</p>
                            <p class="text-2xl font-bold mt-1" data-field="vis-score">${g.VisitorPred?.toFixed(0) || '-'}</p>
                            <p class="text-xs mt-1 ${!homeFavored ? 'text-orange-400 font-semibold' : 'text-gray-500'}" data-field="vis-wp">${visWP.toFixed(0)}%</p>
                        </div>
                        <div class="px-3 text-center">
                            <span class="text-gray-500 text-xs">${odds && odds.neutral_site ? '🏟 Neutral' : '@'}</span>
                            <p class="text-xs text-gray-500 mt-1">${g.PredTempo?.toFixed(0) || '-'} poss</p>
                            <p class="text-xs text-gray-600 mt-1">KP by ${margin.toFixed(0)}</p>
                            ${vegasLine ? `<p class="text-[10px] text-cyan-400 mt-1 font-semibold">${vegasLine}</p>` : ''}
                            ${vegasOU ? `<p class="text-[10px] text-gray-500">O/U ${vegasOU}</p>` : ''}
                            ${lineMove !== null && lineMove !== 0 ? `<p class="text-[10px] ${Math.abs(lineMove) >= 2 ? 'text-yellow-400 font-bold' : 'text-gray-400'} mt-0.5">Line: ${openSpread !== null ? openSpread + ' → ' : ''}${intel.current_spread}${Math.abs(lineMove) >= 2 ? ' ⚡' : ''}</p>` : ''}
                            ${discrepancy > 0 ? `<p class="text-[10px] ${discrepancy >= 5 ? 'text-red-400 font-bold' : discrepancy >= 3 ? 'text-yellow-400' : 'text-gray-500'} mt-0.5">${discrepancy.toFixed(1)}pt gap</p>` : ''}
                        </div>
                        <div class="text-center flex-1" data-role="home">
                            <p class="text-xs text-gray-500">#${g.HomeRank || '?'}</p>
                            <p class="font-bold text-sm ${homeFavored ? 'text-orange-300' : ''}">${g.Home || 'TBD'}</p>
                            <p class="text-2xl font-bold mt-1" data-field="home-score">${g.HomePred?.toFixed(0) || '-'}</p>
                            <p class="text-xs mt-1 ${homeFavored ? 'text-orange-400 font-semibold' : 'text-gray-500'}" data-field="home-wp">${homeWP.toFixed(0)}%</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-700 pt-2">
                        <span class="text-xs text-gray-500">Thrill: <span class="${(g.ThrillScore || 0) >= 60 ? 'text-green-400' : (g.ThrillScore || 0) >= 40 ? 'text-yellow-400' : 'text-gray-400'}">${g.ThrillScore?.toFixed(1) || '-'}</span></span>
                        <button onclick="predictGame('${(g.Visitor || '').replace(/'/g, "\\'")}',' ${(g.Home || '').replace(/'/g, "\\'")}'${odds && odds.neutral_site ? ', true' : ''})"
                            class="text-xs bg-orange-500/20 hover:bg-orange-500/40 text-orange-400 px-3 py-1 rounded transition-all">
                            <i class="fas fa-exchange-alt mr-1"></i>Predict
                        </button>
                    </div>
                    ${officials.length > 0 ? `<div class="border-t border-gray-700/50 pt-1.5 mt-1.5">
                        <p class="text-[9px] text-gray-600"><i class="fas fa-gavel mr-1"></i>${officials.map(o => o.name).join(', ')}</p>
                    </div>` : ''}
                </div>`;
            }).join('');

                if (Array.isArray(savedPreds)) {
                    savedPreds.forEach(p => {

                                    };
                        }
                    });
                }
            } catch (e) { console.warn('Could not load saved predictions:', e); }

            const recapDate = new Date(date + 'T12:00:00');

            // Compute next-day date for single-day diff method
            const nextDate = new Date(recapDate); nextDate.setDate(nextDate.getDate() + 1);
            const nextDateStr = nextDate.toISOString().split('T')[0];

            // Fetch fanmatch + game-day archive + next-day archive + ESPN scores + odds + supplemental data
            const [fanmatch, archDay, archNext, espnScores, espnOdds, ffAll, htAll, confAll, msAll, pdAll, starsAll] = await Promise.all([
                fetchAPI(`/fanmatch?date=${date}`),
                fetchAPI(`/archive?date=${date}`),
                fetchAPI(`/archive?date=${nextDateStr}`),
                fetchAPI(`/scores?date=${date}`).catch(() => []),
                fetchAPI(`/odds?date=${date}`).catch(() => []),
                fetchAPI(`/four-factors?year=${year}`).catch(() => []),
                fetchAPI(`/height?year=${year}`).catch(() => []),
                fetchAPI(`/conf-ratings?year=${year}`).catch(() => []),
                fetchAPI(`/misc-stats?year=${year}`).catch(() => []),
                fetchAPI(`/pointdist?year=${year}`).catch(() => []),
                fetchAPI('/stars').catch(() => ({}))
            ]);

            if (fanmatch.error) {
                const msg = (fanmatch.error.includes('400') || fanmatch.error.includes('Bad Request'))
                    ? 'No game data available for this date.' : fanmatch.error;
                container.innerHTML = `<div class="text-center text-red-400 py-8"><i class="fas fa-calendar-times mr-2"></i>${msg}</div>`;
                return;
            }
            if (!Array.isArray(fanmatch) || fanmatch.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-8">No games found for this date</div>';
                return;
            }
            if (!Array.isArray(archDay)) {
                container.innerHTML = '<div class="text-center text-red-400 py-8"><i class="fas fa-exclamation-triangle mr-2"></i>Archive data not available for this date</div>';
                return;
            }

            // Build lookup maps
            const dayMap = {};
            archDay.forEach(t => { dayMap[t.TeamName] = t; });
            // Next-day archive: used for single-day diff on older dates
            const hasNext = Array.isArray(archNext) && archNext.length > 0;
            const nextMap = {};
            if (hasNext) archNext.forEach(t => { nextMap[t.TeamName] = t; });

            // Build supplemental lookup maps for composite model
            const findTeam = (arr, name) => (Array.isArray(arr) ? arr : []).find(t => t.TeamName === name) || null;
            const confMap = {};
            if (Array.isArray(confAll)) confAll.forEach(c => { if (c.ConfShort && c.Rating) confMap[c.ConfShort] = c.Rating; });

            // ESPN score matching: normalize names for fuzzy lookup
            function normName(n) {
                return (n || '').toLowerCase().replace(/\./g, '').replace(/[']/g, '').replace(/\s+/g, ' ')
                    .replace(/ (bulldogs|wildcats|tigers|bears|eagles|hawks|huskies|knights|lions|panthers|warriors|wolves|cougars|cardinals|aggies|longhorns|gators|seminoles|wolverines|spartans|buckeyes|badgers|hoosiers|hawkeyes|boilermakers|terrapins|cornhuskers|illini|fighting irish|volunteers|razorbacks|crimson tide|rebels|commodores|gamecocks|mountaineers|cyclones|jayhawks|sooners|cowboys|red raiders|horned frogs|bears|bruins|trojans|beavers|ducks|sun devils|utes|buffaloes|golden gophers|nittany lions|scarlet knights|orange|blue devils|tar heels|demon deacons|yellow jackets|cavaliers|hokies|wolfpack|pirates|golden eagles|flyers|musketeers|blue jays|friars|hoyas|red storm|terriers|colonials|bonnies|explorers|dukes|billikens|spiders|rams|monarchs|phoenix|gaels|broncos|toreros|waves|dons|pilots|zags|lumberjacks|anteaters|highlanders|matadors|gauchos|mustangs|aztecs|falcons|rockets|bobcats|penguins|thundering herd|golden flashes|redhawks|zips|chippewas|broncos|cardinals|sycamores|braves|leathernecks|redbirds|salukis|shockers|jaguars|panthers|flames|bison|mastodons|kangaroos|grizzlies)$/i, '')
                    .trim();
            }
            const scoreMap = {};
            const hasScores = Array.isArray(espnScores) && espnScores.length > 0;
            if (hasScores) {
                espnScores.forEach(s => {
                    // Index by multiple name variants for robust matching
                    const keys = [
                        normName(s.home) + '|' + normName(s.away),
                        normName(s.home_full) + '|' + normName(s.away_full),
                        normName(s.home) + '|' + normName(s.away_full),
                        normName(s.home_full) + '|' + normName(s.away),
                    ];
                    keys.forEach(k => { scoreMap[k] = s; });
                });
            }
            function findScore(kpHome, kpVisitor) {
                const nh = normName(kpHome), nv = normName(kpVisitor);
                // Try direct match
                let s = scoreMap[nh + '|' + nv];
                if (s) return s;
                // Try partial match: find any score entry where both home & away partially match
                if (hasScores) {
                    for (const sc of espnScores) {
                        const sh = normName(sc.home), shf = normName(sc.home_full);
                        const sa = normName(sc.away), saf = normName(sc.away_full);
                        if ((nh.includes(sh) || sh.includes(nh) || nh.includes(shf) || shf.includes(nh)) &&
                            (nv.includes(sa) || sa.includes(nv) || nv.includes(saf) || saf.includes(nv))) {
                            return sc;
                        }
                    }
                }
                return null;
            }

            // DraftKings odds matching: same fuzzy approach as scores
            const oddsMap = {};
            const hasOdds = Array.isArray(espnOdds) && espnOdds.length > 0;
            if (hasOdds) {
                espnOdds.forEach(o => {
                    const keys = [
                        normName(o.home) + '|' + normName(o.away),
                        normName(o.home_full) + '|' + normName(o.away_full),
                        normName(o.home) + '|' + normName(o.away_full),
                        normName(o.home_full) + '|' + normName(o.away),
                    ];
                    keys.forEach(k => { oddsMap[k] = o; });
                });
            }
            function findOdds(kpHome, kpVisitor) {
                const nh = normName(kpHome), nv = normName(kpVisitor);
                let o = oddsMap[nh + '|' + nv];
                if (o) return o;
                if (hasOdds) {
                    for (const od of espnOdds) {
                        const oh = normName(od.home), ohf = normName(od.home_full);
                        const oa = normName(od.away), oaf = normName(od.away_full);
                        if ((nh.includes(oh) || oh.includes(nh) || nh.includes(ohf) || ohf.includes(nh)) &&
                            (nv.includes(oa) || oa.includes(nv) || nv.includes(oaf) || oaf.includes(nv))) {
                            return od;
                        }
                    }
                }
                return null;
            }

            const games = [];

            for (const g of fanmatch) {
                const home = g.Home, visitor = g.Visitor;
                const dH = dayMap[home], dV = dayMap[visitor];
                if (!dH || !dV) continue;

                let homeEMChg, visEMChg, homeRkChg, visRkChg;

                if (hasNext && nextMap[home] && nextMap[visitor]) {
                    homeEMChg = nextMap[home].AdjEM - dH.AdjEM;
                    visEMChg  = nextMap[visitor].AdjEM - dV.AdjEM;
                    homeRkChg = (dH.RankAdjEM || 0) - (nextMap[home].RankAdjEM || 0);
                    visRkChg  = (dV.RankAdjEM || 0) - (nextMap[visitor].RankAdjEM || 0);
                } else {
                    homeEMChg = dH.AdjEMChg || 0;
                    visEMChg  = dV.AdjEMChg || 0;
                    homeRkChg = dH.RankChg || 0;
                    visRkChg  = dV.RankChg || 0;
                }

                // Actual scores from ESPN
                const sc = findScore(home, visitor);
                const hasActual = !!sc;
                const actualHomeScore = hasActual ? sc.home_score : null;
                const actualAwayScore = hasActual ? sc.away_score : null;
                const actualMargin = hasActual ? (actualHomeScore - actualAwayScore) : null;
                const actualWinner = hasActual ? (actualMargin >= 0 ? home : visitor) : null;

                // Fallback to inferred winner if no ESPN score
                const resultSignal = homeEMChg - visEMChg;
                const inferredWinner = hasActual ? actualWinner : (resultSignal >= 0 ? home : visitor);
                const confidence = hasActual ? Math.abs(actualMargin) : Math.abs(resultSignal);

                // KenPom's prediction
                const kpPredMargin = (g.HomePred || 0) - (g.VisitorPred || 0);
                const kpPredWinner = kpPredMargin >= 0 ? home : visitor;

                // Fetch odds early so situational dampening can be applied
                const odds = findOdds(home, visitor);

                // Our model: use cached prediction from Games tab if available, else run fresh
                const cacheKey = visitor + '|' + home;
                const cached = window._gamePredCache[cacheKey];
                let ourMargin, ourPredWinner, ourPredTotal;
                if (cached) {
                    ourMargin = cached.ourMargin;
                    ourPredWinner = cached.ourPredWinner;
                    ourPredTotal = cached.ourTotal || ((cached.t1Score || 0) + (cached.t2Score || 0));
                } else {
                    const ff1 = findTeam(ffAll, visitor), ff2 = findTeam(ffAll, home);
                    const ht1 = findTeam(htAll, visitor), ht2 = findTeam(htAll, home);
                    const ms1 = findTeam(msAll, visitor), ms2 = findTeam(msAll, home);
                    const pd1 = findTeam(pdAll, visitor), pd2 = findTeam(pdAll, home);
                    dV._ff = ff1; dV._ms = ms1; dV._ht = ht1;
                    dH._ff = ff2; dH._ms = ms2; dH._ht = ht2;
                    const styleClash = calcStyleClash(ff1, ff2);
                    const experience = calcExperienceAdj(ht1, ht2);
                    const confStrength = calcConfAdj(dV, dH, confMap);
                    const HCA = getHCA(dH.ConfShort);
                    const stars1 = (starsAll && starsAll[visitor]) || [];
                    const stars2 = (starsAll && starsAll[home]) || [];
                    const extra = { styleClash, experience, confStrength, ff1, ff2, ht1, ht2, ms1, ms2, pd1, pd2, injuryAdj: 0, stars1, stars2 };
                    const eff = modelEfficiency(dV, dH, 0, HCA, extra);
                    const sim = modelSimilarOpponents(dV, dH, 0, HCA, extra);
                    const cr = modelConRat(dV, dH, 0, HCA, extra);
                    const mc = await modelMonteCarlo(dV, dH, 0, HCA, 5000, extra);
                    // Use dynamic weights with data-quality adjustments (mirrors Matchup Predictor)
                    const hasRichData = !!(ff1 && ff2 && ms1 && ms2 && ht1 && ht2);
                    const avgSOS = ((dV.SOS || 0) + (dH.SOS || 0)) / 2;
                    const avgGames = ((dV.Wins||0) + (dV.Losses||0) + (dH.Wins||0) + (dH.Losses||0)) / 2;
                    let rwEff = DYNAMIC_WEIGHTS ? DYNAMIC_WEIGHTS.efficiency : 0.10;
                    let rwSim = DYNAMIC_WEIGHTS ? DYNAMIC_WEIGHTS.similar : 0.10;
                    let rwCR = DYNAMIC_WEIGHTS ? DYNAMIC_WEIGHTS.conrat : 0.20;
                    let rwMC = DYNAMIC_WEIGHTS ? DYNAMIC_WEIGHTS.mc : 0.60;
                    if (!hasRichData) { rwMC -= 0.10; rwEff += 0.05; rwCR += 0.05; }
                    if (avgGames < 15) { rwMC -= 0.05; rwCR += 0.05; }
                    if (Math.abs(avgSOS) > 5) { rwSim += 0.03; rwMC -= 0.03; }
                    const rwTotal = rwEff + rwSim + rwCR + rwMC;
                    rwEff /= rwTotal; rwSim /= rwTotal; rwCR /= rwTotal; rwMC /= rwTotal;
                    ourMargin = calibrateSpread(eff.margin * rwEff + sim.margin * rwSim + cr.margin * rwCR + mc.margin * rwMC);
                    ourPredWinner = ourMargin >= 0 ? visitor : home;
                    // Compute predicted total from sub-model scores
                    const rawT1 = eff.t1Score * rwEff + sim.t1Score * rwSim + cr.t1Score * rwCR + mc.t1Score * rwMC;
                    const rawT2 = eff.t2Score * rwEff + sim.t2Score * rwSim + cr.t2Score * rwCR + mc.t2Score * rwMC;
                    ourPredTotal = calibrateTotal(rawT1 + rawT2);

                    // Situational dampening (mirrors matchup predictor lines 1757-1774)
                    // Only apply to fresh predictions; cached values already include dampening
                    const isNeutral = odds && odds.neutral_site;
                    const sameConf = dV.ConfShort && dV.ConfShort === dH.ConfShort;
                    const currentMonth = recapDate.getMonth(); // 0-indexed, use recap date not today
                    const isConfTourney = isNeutral && sameConf && currentMonth === 2; // March
                    const isEarlySeason = currentMonth >= 10 || currentMonth === 0; // Nov-Jan
                    // Note: NCAA tournament toggle not available in Recap tab, skip that check
                    if (isConfTourney) {
                        ourMargin *= 0.88;
                        ourPredTotal *= 0.975;
                    } else if (isNeutral) {
                        ourMargin *= 0.90;
                        ourPredTotal *= 0.98;
                    }
                    if (isEarlySeason) {
                        ourMargin *= 0.95;
                        ourPredTotal *= 0.98;
                    }
                    ourPredWinner = ourMargin >= 0 ? visitor : home;
                }

                const ourCorrect = ourPredWinner === inferredWinner;
                const kpCorrect  = kpPredWinner === inferredWinner;

                // Spread error: how far off was our predicted margin from the actual margin?
                // ourMargin is visitor-relative (positive = visitor favored)
                // Convert to home-relative: ourPredHome = -ourMargin
                // actualMargin is home-relative (positive = home won by X)
                const ourPredHome = -ourMargin;
                const ourSpreadError = hasActual ? Math.abs(ourPredHome - actualMargin) : null;
                const kpSpreadError = hasActual ? Math.abs(kpPredMargin - actualMargin) : null;

                // DraftKings spread from ESPN odds (odds already fetched above)
                // spread is home-relative from ESPN (negative = home favored)
                const dkSpread = odds ? parseFloat(odds.spread) : null;
                const dkDetails = odds ? (odds.details || '') : '';
                const dkOverUnder = odds ? parseFloat(odds.over_under) : null;
                const dkHomeFav = odds ? odds.home_favorite : null;
                // ATS: compare our predicted spread vs DK line to determine bet side,
                // then check vs final score to see if that bet covered.
                // ourPredHome = home wins by X (positive = home wins, e.g. 13.8)
                // dkSpread = ESPN convention (negative = home favored, e.g. -13.5)
                // Convert ourPredHome to DK convention: -ourPredHome (e.g. -13.8)
                // If -ourPredHome < dkSpread → we're more bullish on home → bet home
                // Then check vs final score: actualMargin + dkSpread > 0 → home covered
                let ourATS = null;  // null = no odds or no score
                let atsBetSide = null; // 'home' or 'away'
                let atsEdge = null; // how many points our spread disagrees with DK
                if (dkSpread !== null && !isNaN(dkSpread) && hasActual) {
                    const ourSpreadDK = -ourPredHome; // convert to DK convention
                    atsEdge = Math.abs(ourSpreadDK - dkSpread);
                    // Determine which side we'd bet
                    if (ourSpreadDK < dkSpread) {
                        // Our model more bullish on home (e.g. -13.8 < -13.5) → bet home
                        atsBetSide = 'home';
                    } else if (ourSpreadDK > dkSpread) {
                        // Our model more bullish on away → bet away
                        atsBetSide = 'away';
                    }
                    // Check vs final score
                    const resultVsSpread = actualMargin + dkSpread; // >0 = home covered, <0 = away covered
                    const push = resultVsSpread === 0;
                    if (push) {
                        ourATS = 'push';
                    } else if (atsBetSide === 'home') {
                        ourATS = resultVsSpread > 0 ? 'hit' : 'miss';
                    } else if (atsBetSide === 'away') {
                        ourATS = resultVsSpread < 0 ? 'hit' : 'miss';
                    }
                }

                // O/U (Over/Under) comparison logic
                let ourOU = null;   // 'hit', 'miss', 'push'
                let ouBetSide = null; // 'over' or 'under'
                let ouEdge = null;
                if (dkOverUnder !== null && !isNaN(dkOverUnder) && dkOverUnder > 0 && hasActual && ourPredTotal) {
                    const actualTotal = actualHomeScore + actualAwayScore;
                    ouEdge = Math.abs(ourPredTotal - dkOverUnder);
                    if (ourPredTotal > dkOverUnder) {
                        ouBetSide = 'over';
                    } else if (ourPredTotal < dkOverUnder) {
                        ouBetSide = 'under';
                    }
                    const actualVsLine = actualTotal - dkOverUnder;
                    if (actualVsLine === 0) {
                        ourOU = 'push';
                    } else if (ouBetSide === 'over') {
                        ourOU = actualVsLine > 0 ? 'hit' : 'miss';
                    } else if (ouBetSide === 'under') {
                        ourOU = actualVsLine < 0 ? 'hit' : 'miss';
                    }
                }

                games.push({
                    home, visitor, homeRank: g.HomeRank, visRank: g.VisitorRank,
                    kpHomePred: g.HomePred, kpVisPred: g.VisitorPred,
                    kpPredMargin, kpPredWinner, kpCorrect,
                    ourMargin, ourPredWinner, ourCorrect, ourPredTotal,
                    homeEMChg, visEMChg, homeRkChg, visRkChg,
                    resultSignal, inferredWinner, confidence,
                    thrillScore: g.ThrillScore || 0,
                    hasActual, actualHomeScore, actualAwayScore, actualMargin, actualWinner,
                    ourSpreadError, kpSpreadError,
                    dkSpread, dkDetails, dkOverUnder, dkHomeFav, ourATS, atsBetSide, atsEdge,
                    ourOU, ouBetSide, ouEdge
                });
            }

            if (games.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-8">No matchable games found (archive data may not cover this date)</div>';
                return;
            }

            // Sort: biggest margin games first (by actual margin if available, else confidence)
            const byMiss = [...games].sort((a, b) => (b.hasActual ? Math.abs(b.actualMargin) : b.confidence) - (a.hasActual ? Math.abs(a.actualMargin) : a.confidence));
            const ourRight = games.filter(g => g.ourCorrect).length;
            const kpRight  = games.filter(g => g.kpCorrect).length;
            const total = games.length;
            const scored = games.filter(g => g.hasActual).length;
            const ourPct = ((ourRight / total) * 100).toFixed(0);
            const kpPct  = ((kpRight / total) * 100).toFixed(0);
            const bothRight  = games.filter(g => g.ourCorrect && g.kpCorrect).length;
            const weOnlyRight = games.filter(g => g.ourCorrect && !g.kpCorrect).length;
            const kpOnlyRight = games.filter(g => !g.ourCorrect && g.kpCorrect).length;
            const bothWrong  = games.filter(g => !g.ourCorrect && !g.kpCorrect).length;

            // Spread accuracy stats (only for games with actual scores)
            const scoredGames = games.filter(g => g.hasActual);
            const ourErrors = scoredGames.map(g => g.ourSpreadError).filter(e => e !== null);
            const kpErrors = scoredGames.map(g => g.kpSpreadError).filter(e => e !== null);
            const ourAvgErr = ourErrors.length > 0 ? (ourErrors.reduce((a, b) => a + b, 0) / ourErrors.length).toFixed(1) : '-';
            const kpAvgErr = kpErrors.length > 0 ? (kpErrors.reduce((a, b) => a + b, 0) / kpErrors.length).toFixed(1) : '-';
            const ourMedErr = ourErrors.length > 0 ? ourErrors.sort((a, b) => a - b)[Math.floor(ourErrors.length / 2)].toFixed(1) : '-';
            const kpMedErr = kpErrors.length > 0 ? kpErrors.sort((a, b) => a - b)[Math.floor(kpErrors.length / 2)].toFixed(1) : '-';

            // ATS stats (only for games with DK spread + actual score)
            const atsGames = games.filter(g => g.ourATS !== null);
            const atsHits = atsGames.filter(g => g.ourATS === 'hit').length;
            const atsMisses = atsGames.filter(g => g.ourATS === 'miss').length;
            const atsPushes = atsGames.filter(g => g.ourATS === 'push').length;
            const atsTotal = atsHits + atsMisses; // exclude pushes from %
            const atsPct = atsTotal > 0 ? ((atsHits / atsTotal) * 100).toFixed(0) : '-';
            const atsWithLines = games.filter(g => g.dkSpread !== null && !isNaN(g.dkSpread)).length;

            // High-conviction ATS: only games where our edge >= 3 pts
            const EDGE_THRESHOLD = 3;
            const hcGames = atsGames.filter(g => g.atsEdge !== null && g.atsEdge >= EDGE_THRESHOLD);
            const hcHits = hcGames.filter(g => g.ourATS === 'hit').length;
            const hcMisses = hcGames.filter(g => g.ourATS === 'miss').length;
            const hcPushes = hcGames.filter(g => g.ourATS === 'push').length;
            const hcTotal = hcHits + hcMisses;
            const hcPct = hcTotal > 0 ? ((hcHits / hcTotal) * 100).toFixed(0) : '-';
            const hasHC = hcTotal > 0;

            // O/U stats
            const ouGames = games.filter(g => g.ourOU !== null);
            const ouHits = ouGames.filter(g => g.ourOU === 'hit').length;
            const ouMisses = ouGames.filter(g => g.ourOU === 'miss').length;
            const ouPushes = ouGames.filter(g => g.ourOU === 'push').length;
            const ouTotal = ouHits + ouMisses;
            const ouPct = ouTotal > 0 ? ((ouHits / ouTotal) * 100).toFixed(0) : '-';
            const hasOU = ouTotal > 0;

            // High-conviction O/U: only games where our edge >= 3 pts
            const ouHcGames = ouGames.filter(g => g.ouEdge !== null && g.ouEdge >= EDGE_THRESHOLD);
            const ouHcHits = ouHcGames.filter(g => g.ourOU === 'hit').length;
            const ouHcMisses = ouHcGames.filter(g => g.ourOU === 'miss').length;
            const ouHcTotal = ouHcHits + ouHcMisses;
            const ouHcPct = ouHcTotal > 0 ? ((ouHcHits / ouHcTotal) * 100).toFixed(0) : '-';
            const hasOUHC = ouHcTotal > 0;

            // Total prediction error
            const totalErrors = games.filter(g => g.hasActual && g.ourPredTotal)
                .map(g => Math.abs(g.ourPredTotal - (g.actualHomeScore + g.actualAwayScore)));
            const avgTotalError = totalErrors.length > 0
                ? (totalErrors.reduce((a, b) => a + b, 0) / totalErrors.length).toFixed(1) : '-';

            // Auto-save ATS results for the tracker
            if (atsGames.length > 0 || ouGames.length > 0) {
                const atsDateStr = recapDate.toISOString().slice(0, 10);
                const saveGames = games.filter(g => g.ourATS !== null || g.ourOU !== null);
                const atsSaveData = {
                    date: atsDateStr,
                    summary: {
                        totalGames: total, scored, atsWithLines,
                        atsHits, atsMisses, atsPushes, atsPct: atsTotal > 0 ? Math.round((atsHits / atsTotal) * 100) : null,
                        hcHits, hcMisses, hcPushes, hcPct: hcTotal > 0 ? Math.round((hcHits / hcTotal) * 100) : null,
                        ourPct: Math.round((ourRight / total) * 100),
                        avgErr: ourAvgErr !== '-' ? parseFloat(ourAvgErr) : null,
                        // O/U fields
                        ouHits, ouMisses, ouPushes,
                        ouPct: ouTotal > 0 ? Math.round((ouHits / ouTotal) * 100) : null,
                        ouHcHits, ouHcMisses,
                        ouHcPct: ouHcTotal > 0 ? Math.round((ouHcHits / ouHcTotal) * 100) : null,
                        avgTotalError: avgTotalError !== '-' ? parseFloat(avgTotalError) : null,
                    },
                    games: saveGames.map(g => ({
                        home: g.home, visitor: g.visitor,
                        ourPredWinner: g.ourPredWinner, ourMargin: g.ourMargin,
                        dkSpread: g.dkSpread, dkDetails: g.dkDetails,
                        actualMargin: g.actualMargin, actualWinner: g.actualWinner,
                        ourATS: g.ourATS, atsBetSide: g.atsBetSide, atsEdge: g.atsEdge,
                        // O/U fields
                        ourPredTotal: g.ourPredTotal,
                        dkOverUnder: g.dkOverUnder,
                        ourOU: g.ourOU, ouBetSide: g.ouBetSide, ouEdge: g.ouEdge,
                    }))
                };
                fetch(`${API_BASE}/ats-results`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(atsSaveData) }).catch(() => {});
            }

            const recapDateFmt = recapDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            const scoreSource = scored > 0 ? `${scored}/${total} games with final scores from ESPN` : 'No ESPN scores available — using inferred winners';

            container.innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-white mb-1"><i class="fas fa-clipboard-check mr-2 text-orange-400"></i>Game Recap</h2>
                    <p class="text-gray-400">${recapDateFmt} &mdash; ${total} games analyzed</p>
                    <p class="text-xs ${scored > 0 ? 'text-green-400' : 'text-yellow-400'} mt-1"><i class="fas fa-${scored > 0 ? 'check-circle' : 'exclamation-circle'} mr-1"></i>${scoreSource}</p>
                    ${atsWithLines > 0 ? `<p class="text-xs text-cyan-400 mt-0.5"><i class="fas fa-dollar-sign mr-1"></i>${atsWithLines}/${total} games with DraftKings lines</p>` : ''}
                </div>

                <!-- Accuracy Summary -->
                <div class="grid grid-cols-2 md:grid-cols-${scored > 0 && hasOU && hasHC ? '8' : scored > 0 && hasOU ? '7' : scored > 0 && hasHC ? '5' : scored > 0 && atsWithLines > 0 ? '4' : scored > 0 ? '3' : '2'} gap-3 mb-6">
                    <div class="bg-gray-800 rounded-xl p-4 text-center border ${parseInt(ourPct) >= parseInt(kpPct) ? 'border-green-500/40' : 'border-gray-700'}">
                        <p class="text-3xl font-bold ${parseInt(ourPct) >= 70 ? 'text-green-400' : parseInt(ourPct) >= 55 ? 'text-yellow-400' : 'text-red-400'}">${ourPct}%</p>
                        <p class="text-xs text-gray-400 mt-1">Our SU Pick</p>
                        <p class="text-xs text-gray-500">${ourRight}/${total}</p>
                    </div>
                    <div class="bg-gray-800 rounded-xl p-4 text-center border ${parseInt(kpPct) > parseInt(ourPct) ? 'border-blue-500/40' : 'border-gray-700'}">
                        <p class="text-3xl font-bold ${parseInt(kpPct) >= 70 ? 'text-blue-400' : parseInt(kpPct) >= 55 ? 'text-yellow-400' : 'text-red-400'}">${kpPct}%</p>
                        <p class="text-xs text-gray-400 mt-1">KenPom SU</p>
                        <p class="text-xs text-gray-500">${kpRight}/${total}</p>
                    </div>
                    ${scored > 0 ? `
                    <div class="bg-gray-800 rounded-xl p-4 text-center border ${parseFloat(ourAvgErr) <= parseFloat(kpAvgErr) ? 'border-green-500/40' : 'border-gray-700'}">
                        <p class="text-3xl font-bold ${parseFloat(ourAvgErr) <= 10 ? 'text-green-400' : parseFloat(ourAvgErr) <= 14 ? 'text-yellow-400' : 'text-red-400'}">${ourAvgErr}</p>
                        <p class="text-xs text-gray-400 mt-1">Our Avg Error</p>
                        <p class="text-xs text-gray-500">pts off spread</p>
                    </div>
                    ` : ''}

        async function predictGame(visitor, home, neutralSite) {
            // Track which game card triggered this so we can update it after prediction
            const visClean = (visitor || '').replace(/[^a-zA-Z]/g, '');
            const homeClean = (home || '').replace(/[^a-zA-Z]/g, '');
            window._predictSourceCardId = `game-${visClean}-${homeClean}`;

            // Load teams before opening modal (openMatchupModal resets allTeamsData)
            const year = document.getElementById('global-year').value || '2026';
            const data = await fetchAPI(`/ratings?year=${year}`);
            if (!data.error && Array.isArray(data)) allTeamsData = data;
            allTeamsYear = year;

            const t1 = allTeamsData.find(t => t.TeamName === visitor.trim());
            const t2 = allTeamsData.find(t => t.TeamName === home.trim());

            // Open modal and reset UI without wiping allTeamsData
            document.getElementById('matchup-modal').classList.add('active');
            matchupTeam1 = null; matchupTeam2 = null;
            document.getElementById('matchup-team1').value = '';
            document.getElementById('matchup-team2').value = '';
            document.getElementById('matchup-team1-info').classList.add('hidden');
            document.getElementById('matchup-team2-info').classList.add('hidden');
            document.getElementById('matchup-result').classList.add('hidden');
            document.getElementById('predict-btn').disabled = true;
            setMatchupLocation(neutralSite ? 'neutral' : 'team2'); // neutral site or visitor @ home

            if (t1) selectMatchupTeam(1, t1);
            if (t2) selectMatchupTeam(2, t2);
        }

        // ── BACKTEST FUNCTIONS ──
        async function runBacktest() {
            const start = document.getElementById('backtest-start').value;
            const end = document.getElementById('backtest-end').value;
            const historical = document.getElementById('backtest-historical').checked;
            if (!start || !end) { alert('Please select start and end dates'); return; }
            const container = document.getElementById('backtest-results');
            const btn = document.getElementById('backtest-run-btn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Running...';
            const modeLabel = historical ? 'historical ratings (no lookahead bias)' : 'current ratings';
            container.innerHTML = `<div class="text-center py-8"><i class="fas fa-spinner fa-spin text-2xl text-purple-400"></i><p class="text-sm text-gray-400 mt-2">Backtesting with ${modeLabel}... This may take a minute.</p></div>`;
            try {
                const resp = await fetch(`${API_BASE}/backtest?start=${start}&end=${end}&historical=${historical}`);
                const data = await resp.json();
                if (data.error) { container.innerHTML = `<div class="text-center text-red-400 py-8">${data.error}</div>`; return; }
                renderBacktestResults(data);
            } catch (e) {
                container.innerHTML = `<div class="text-center text-red-400 py-8">Error: ${e.message}</div>`;
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-play mr-1"></i>Run Backtest';
            }
        }

        async function runSavedBacktest() {
            const container = document.getElementById('backtest-results');
            container.innerHTML = '<div class="text-center py-8"><i class="fas fa-spinner fa-spin text-2xl text-purple-400"></i></div>';
            try {
                const resp = await fetch(`${API_BASE}/backtest/predictions`);
                const data = await resp.json();
                if (data.error) { container.innerHTML = `<div class="text-center text-red-400 py-8">${data.error}</div>`; return; }
                renderBacktestResults(data);
            } catch (e) {
                container.innerHTML = `<div class="text-center text-red-400 py-8">Error: ${e.message}</div>`;
            }
        }

        // Apply calibration recommendations to the live system
        async function applyCalibrationRecommendations(highConfOnly) {
            const recs = window._lastCalibrationRecs;
            if (!recs) { alert('No recommendations available'); return; }

            const body = {
                close_coeff: SPREAD_COEFFS.close,
                moderate_coeff: SPREAD_COEFFS.moderate,
                log_multiplier: SPREAD_COEFFS.logMult,
                sample_size: 0,
                source_backtest: new Date().toISOString(),
            };

            if (recs.close_games_0_7 && (!highConfOnly || recs.close_games_0_7.confidence === 'high')) {
                body.close_coeff = recs.close_games_0_7.recommended;
                body.sample_size += recs.close_games_0_7.sample_size;
            }
            if (recs.moderate_spreads_7_14 && (!highConfOnly || recs.moderate_spreads_7_14.confidence === 'high')) {
                body.moderate_coeff = recs.moderate_spreads_7_14.recommended;
                body.sample_size += recs.moderate_spreads_7_14.sample_size;
            }
            if (recs.blowouts_14_plus && (!highConfOnly || recs.blowouts_14_plus.confidence === 'high')) {
                body.log_multiplier = recs.blowouts_14_plus.recommended_log_mult;
                body.sample_size += recs.blowouts_14_plus.sample_size;
            }

            try {
                const resp = await fetch(`${API_BASE}/calibration`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body),
                });
                if (resp.ok) {
                    const data = await resp.json();
                    SPREAD_COEFFS.close = data.close_coeff;
                    SPREAD_COEFFS.moderate = data.moderate_coeff;
                    SPREAD_COEFFS.logMult = data.log_multiplier;
                    alert(`Calibration updated!\nClose: ${data.close_coeff}\nModerate: ${data.moderate_coeff}\nLog Mult: ${data.log_multiplier}\n\nRe-run the backtest to verify improvement.`);
                } else {
                    alert('Failed to update calibration');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        function renderATSTracker(history) {
            const container = document.getElementById('ats-tracker-results');
            // Aggregate all games across dates
            const allGames = history.flatMap(h => h.games || []);
            const allHits = allGames.filter(g => g.ourATS === 'hit').length;
            const allMisses = allGames.filter(g => g.ourATS === 'miss').length;
            const allPushes = allGames.filter(g => g.ourATS === 'push').length;
            const allTotal = allHits + allMisses;
            const allPct = allTotal > 0 ? Math.round((allHits / allTotal) * 100) : 0;

            // High conviction (3+ pt edge)
            const hcAll = allGames.filter(g => g.atsEdge >= 3);
            const hcHits = hcAll.filter(g => g.ourATS === 'hit').length;
            const hcMisses = hcAll.filter(g => g.ourATS === 'miss').length;
            const hcTotal = hcHits + hcMisses;
            const hcPct = hcTotal > 0 ? Math.round((hcHits / hcTotal) * 100) : 0;

            // O/U cumulative stats
            const ouAllGames = allGames.filter(g => g.ourOU != null);
            const ouAllHits = ouAllGames.filter(g => g.ourOU === 'hit').length;
            const ouAllMisses = ouAllGames.filter(g => g.ourOU === 'miss').length;
            const ouAllPushes = ouAllGames.filter(g => g.ourOU === 'push').length;
            const ouAllTotal = ouAllHits + ouAllMisses;
            const ouAllPct = ouAllTotal > 0 ? Math.round((ouAllHits / ouAllTotal) * 100) : 0;
            const hasOUData = ouAllTotal > 0;

            // O/U high conviction (3+ pt edge)
            const ouHcAll = ouAllGames.filter(g => (g.ouEdge || 0) >= 3);
            const ouHcHits = ouHcAll.filter(g => g.ourOU === 'hit').length;
            const ouHcMisses = ouHcAll.filter(g => g.ourOU === 'miss').length;
            const ouHcTotal = ouHcHits + ouHcMisses;
            const ouHcPct = ouHcTotal > 0 ? Math.round((ouHcHits / ouHcTotal) * 100) : 0;

            // Edge buckets: 0-1, 1-3, 3-5, 5-8, 8+
            const edgeBuckets = {'0-1': [], '1-3': [], '3-5': [], '5-8': [], '8+': []};
            for (const g of allGames) {
                const e = g.atsEdge || 0;
                if (e < 1) edgeBuckets['0-1'].push(g);
                else if (e < 3) edgeBuckets['1-3'].push(g);
                else if (e < 5) edgeBuckets['3-5'].push(g);
                else if (e < 8) edgeBuckets['5-8'].push(g);
                else edgeBuckets['8+'].push(g);
            }

            const bucketHTML = Object.entries(edgeBuckets).map(([name, games]) => {
                const h = games.filter(g => g.ourATS === 'hit').length;
                const m = games.filter(g => g.ourATS === 'miss').length;
                const t = h + m;
                const pct = t > 0 ? Math.round((h / t) * 100) : '-';
                return `<div class="bg-gray-800 rounded-lg p-3 text-center">
                    <p class="text-xs text-gray-400">${name} pts</p>
                    <p class="text-lg font-bold ${pct !== '-' && pct >= 60 ? 'text-emerald-400' : pct !== '-' && pct >= 50 ? 'text-yellow-400' : pct !== '-' ? 'text-red-400' : 'text-gray-500'}">${pct}${pct !== '-' ? '%' : ''}</p>
                    <p class="text-xs text-gray-500">${h}-${m} (${t} bets)</p>
                </div>`;
            }).join('');

            // O/U edge buckets
            const ouEdgeBuckets = {'0-2': [], '2-4': [], '4-6': [], '6+': []};
            for (const g of ouAllGames) {
                const e = g.ouEdge || 0;
                if (e < 2) ouEdgeBuckets['0-2'].push(g);
                else if (e < 4) ouEdgeBuckets['2-4'].push(g);
                else if (e < 6) ouEdgeBuckets['4-6'].push(g);
                else ouEdgeBuckets['6+'].push(g);
            }
            const ouBucketHTML = Object.entries(ouEdgeBuckets).map(([name, games]) => {
                const h = games.filter(g => g.ourOU === 'hit').length;
                const m = games.filter(g => g.ourOU === 'miss').length;
                const t = h + m;
                const pct = t > 0 ? Math.round((h / t) * 100) : '-';
                return `<div class="bg-gray-800 rounded-lg p-3 text-center">
                    <p class="text-xs text-gray-400">${name} pts</p>
                    <p class="text-lg font-bold ${pct !== '-' && pct >= 60 ? 'text-violet-400' : pct !== '-' && pct >= 50 ? 'text-yellow-400' : pct !== '-' ? 'text-red-400' : 'text-gray-500'}">${pct}${pct !== '-' ? '%' : ''}</p>
                    <p class="text-xs text-gray-500">${h}-${m} (${t} bets)</p>
                </div>`;
            }).join('');

            // Rolling cumulative record by day
            let cumHits = 0, cumMisses = 0, cumHcHits = 0, cumHcMisses = 0;
            let cumOUHits = 0, cumOUMisses = 0;
            const dailyRows = history.map(h => {
                const s = h.summary || {};
                cumHits += (s.atsHits || 0); cumMisses += (s.atsMisses || 0);
                cumHcHits += (s.hcHits || 0); cumHcMisses += (s.hcMisses || 0);
                cumOUHits += (s.ouHits || 0); cumOUMisses += (s.ouMisses || 0);
                const cumT = cumHits + cumMisses;
                const cumPct = cumT > 0 ? Math.round((cumHits / cumT) * 100) : '-';
                const cumHcT = cumHcHits + cumHcMisses;
                const cumHcPct = cumHcT > 0 ? Math.round((cumHcHits / cumHcT) * 100) : '-';
                const dayT = (s.atsHits || 0) + (s.atsMisses || 0);
                const dayPct = dayT > 0 ? Math.round(((s.atsHits || 0) / dayT) * 100) : '-';
                const dayOUT = (s.ouHits || 0) + (s.ouMisses || 0);
                const dayOUPct = dayOUT > 0 ? Math.round(((s.ouHits || 0) / dayOUT) * 100) : '-';
                const cumOUT = cumOUHits + cumOUMisses;
                const cumOUPct = cumOUT > 0 ? Math.round((cumOUHits / cumOUT) * 100) : '-';
                return `<tr class="border-t border-gray-700 hover:bg-gray-700/30">
                    <td class="px-3 py-2 text-sm">${h.date}</td>
                    <td class="px-3 py-2 text-center text-sm">${s.totalGames || '-'}</td>
                    <td class="px-3 py-2 text-center text-sm">${s.atsWithLines || '-'}</td>
                    <td class="px-3 py-2 text-center text-sm font-medium ${dayPct !== '-' && dayPct >= 55 ? 'text-emerald-400' : dayPct !== '-' && dayPct >= 45 ? 'text-yellow-400' : dayPct !== '-' ? 'text-red-400' : ''}">${dayPct !== '-' ? dayPct + '%' : '-'}</td>
                    <td class="px-3 py-2 text-center text-sm">${s.atsHits || 0}-${s.atsMisses || 0}${s.atsPushes ? '-' + s.atsPushes + 'P' : ''}</td>
                    <td class="px-3 py-2 text-center text-sm font-bold ${cumPct !== '-' && cumPct >= 55 ? 'text-emerald-400' : cumPct !== '-' && cumPct >= 45 ? 'text-yellow-400' : cumPct !== '-' ? 'text-red-400' : ''}">${cumPct !== '-' ? cumPct + '%' : '-'}</td>
                    <td class="px-3 py-2 text-center text-sm text-gray-400">${cumHits}-${cumMisses}</td>
                    <td class="px-3 py-2 text-center text-sm font-medium ${cumHcPct !== '-' && cumHcPct >= 55 ? 'text-emerald-400' : cumHcPct !== '-' && cumHcPct >= 45 ? 'text-yellow-400' : cumHcPct !== '-' ? 'text-red-400' : ''}">${cumHcPct !== '-' ? cumHcPct + '%' : '-'}</td>
                    <td class="px-3 py-2 text-center text-sm font-medium ${dayOUPct !== '-' && dayOUPct >= 55 ? 'text-violet-400' : dayOUPct !== '-' && dayOUPct >= 45 ? 'text-yellow-400' : dayOUPct !== '-' ? 'text-red-400' : ''}">${dayOUPct !== '-' ? dayOUPct + '%' : '-'}</td>
                    <td class="px-3 py-2 text-center text-sm font-bold ${cumOUPct !== '-' && cumOUPct >= 55 ? 'text-violet-400' : cumOUPct !== '-' && cumOUPct >= 45 ? 'text-yellow-400' : cumOUPct !== '-' ? 'text-red-400' : ''}">${cumOUPct !== '-' ? cumOUPct + '%' : '-'}</td>
                </tr>`;
            }).join('');

            // Profit tracking (assuming $100 per bet, -110 odds)
            const unitSize = 100;
            const winPayout = unitSize * (100/110); // ~$90.91 profit on win
            const allProfit = (allHits * winPayout) - (allMisses * unitSize);
            const hcProfit = (hcHits * winPayout) - (hcMisses * unitSize);
            const ouProfit = (ouAllHits * winPayout) - (ouAllMisses * unitSize);
            const ouHcProfit = (ouHcHits * winPayout) - (ouHcMisses * unitSize);

            container.innerHTML = `
                <div class="space-y-4">
                    <!-- ATS Cumulative Summary Cards -->
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <div class="bg-gradient-to-br from-emerald-900/40 to-gray-800 rounded-xl p-4 border border-emerald-500/30 text-center">
                            <p class="text-xs text-gray-400">All Bets ATS</p>
                            <p class="text-3xl font-bold ${allPct >= 55 ? 'text-emerald-400' : allPct >= 45 ? 'text-yellow-400' : 'text-red-400'}">${allPct}%</p>
                            <p class="text-xs text-gray-500">${allHits}-${allMisses}${allPushes ? '-' + allPushes + 'P' : ''}</p>
                        </div>
                        <div class="bg-gradient-to-br from-cyan-900/40 to-gray-800 rounded-xl p-4 border border-cyan-500/30 text-center">
                            <p class="text-xs text-gray-400">3+ pt Edge ATS</p>
                            <p class="text-3xl font-bold ${hcPct >= 55 ? 'text-cyan-400' : hcPct >= 45 ? 'text-yellow-400' : 'text-red-400'}">${hcPct}%</p>
                            <p class="text-xs text-gray-500">${hcHits}-${hcMisses} high conviction</p>
                        </div>
                        <div class="bg-gradient-to-br from-purple-900/40 to-gray-800 rounded-xl p-4 border border-purple-500/30 text-center">
                            <p class="text-xs text-gray-400">Total Bets</p>
                            <p class="text-3xl font-bold text-white">${allTotal}</p>
                            <p class="text-xs text-gray-500">${history.length} days tracked</p>
                        </div>
                        <div class="bg-gradient-to-br ${allProfit >= 0 ? 'from-green-900/40' : 'from-red-900/40'} to-gray-800 rounded-xl p-4 border ${allProfit >= 0 ? 'border-green-500/30' : 'border-red-500/30'} text-center">
                            <p class="text-xs text-gray-400">ATS P/L</p>
                            <p class="text-3xl font-bold ${allProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${allProfit >= 0 ? '+' : ''}$${allProfit.toFixed(0)}</p>
                            <p class="text-xs text-gray-500">$${unitSize}/bet @ -110</p>
                        </div>
                        <div class="bg-gradient-to-br ${hcProfit >= 0 ? 'from-green-900/40' : 'from-red-900/40'} to-gray-800 rounded-xl p-4 border ${hcProfit >= 0 ? 'border-green-500/30' : 'border-red-500/30'} text-center">
                            <p class="text-xs text-gray-400">HC ATS P/L</p>
                            <p class="text-3xl font-bold ${hcProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${hcProfit >= 0 ? '+' : ''}$${hcProfit.toFixed(0)}</p>
                            <p class="text-xs text-gray-500">3+ pt edge only</p>
                        </div>
                    </div>

                    ${hasOUData ? `
                    <!-- O/U Cumulative Summary Cards -->
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <div class="bg-gradient-to-br from-violet-900/40 to-gray-800 rounded-xl p-4 border border-violet-500/30 text-center">
                            <p class="text-xs text-gray-400">All Bets O/U</p>
                            <p class="text-3xl font-bold ${ouAllPct >= 55 ? 'text-violet-400' : ouAllPct >= 45 ? 'text-yellow-400' : 'text-red-400'}">${ouAllPct}%</p>
                            <p class="text-xs text-gray-500">${ouAllHits}-${ouAllMisses}${ouAllPushes ? '-' + ouAllPushes + 'P' : ''}</p>
                        </div>
                        <div class="bg-gradient-to-br from-pink-900/40 to-gray-800 rounded-xl p-4 border border-pink-500/30 text-center">
                            <p class="text-xs text-gray-400">3+ pt Edge O/U</p>
                            <p class="text-3xl font-bold ${ouHcPct >= 55 ? 'text-pink-400' : ouHcPct >= 45 ? 'text-yellow-400' : 'text-red-400'}">${ouHcPct}%</p>
                            <p class="text-xs text-gray-500">${ouHcHits}-${ouHcMisses} high conviction</p>
                        </div>
                        <div class="bg-gradient-to-br from-purple-900/40 to-gray-800 rounded-xl p-4 border border-purple-500/30 text-center">
                            <p class="text-xs text-gray-400">O/U Total Bets</p>
                            <p class="text-3xl font-bold text-white">${ouAllTotal}</p>
                            <p class="text-xs text-gray-500">${ouAllGames.length} w/ O/U lines</p>
                        </div>
                        <div class="bg-gradient-to-br ${ouProfit >= 0 ? 'from-green-900/40' : 'from-red-900/40'} to-gray-800 rounded-xl p-4 border ${ouProfit >= 0 ? 'border-green-500/30' : 'border-red-500/30'} text-center">
                            <p class="text-xs text-gray-400">O/U P/L</p>
                            <p class="text-3xl font-bold ${ouProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${ouProfit >= 0 ? '+' : ''}$${ouProfit.toFixed(0)}</p>
                            <p class="text-xs text-gray-500">$${unitSize}/bet @ -110</p>
                        </div>
                        <div class="bg-gradient-to-br ${ouHcProfit >= 0 ? 'from-green-900/40' : 'from-red-900/40'} to-gray-800 rounded-xl p-4 border ${ouHcProfit >= 0 ? 'border-green-500/30' : 'border-red-500/30'} text-center">
                            <p class="text-xs text-gray-400">O/U HC P/L</p>
                            <p class="text-3xl font-bold ${ouHcProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${ouHcProfit >= 0 ? '+' : ''}$${ouHcProfit.toFixed(0)}</p>
                            <p class="text-xs text-gray-500">3+ pt edge only</p>
                        </div>
                    </div>
                    ` : ''}

                    <!-- ATS by Edge Bucket -->
                    <div class="bg-gray-800/40 rounded-xl p-4 border border-gray-700">
                        <h4 class="text-sm font-bold text-white mb-3"><i class="fas fa-chart-bar mr-1 text-emerald-400"></i>ATS Hit Rate by Model Edge (pts of disagreement with DK)</h4>
                        <div class="grid grid-cols-5 gap-2">${bucketHTML}</div>
                    </div>

                    ${hasOUData ? `
                    <!-- O/U by Edge Bucket -->
                    <div class="bg-gray-800/40 rounded-xl p-4 border border-gray-700">
                        <h4 class="text-sm font-bold text-white mb-3"><i class="fas fa-chart-bar mr-1 text-violet-400"></i>O/U Hit Rate by Model Edge (pts of disagreement with O/U line)</h4>
                        <div class="grid grid-cols-4 gap-2">${ouBucketHTML}</div>
                    </div>
                    ` : ''}

                    <!-- Daily Breakdown Table -->
                    <div class="bg-gray-800/40 rounded-xl p-4 border border-gray-700">
                        <h4 class="text-sm font-bold text-white mb-3"><i class="fas fa-calendar mr-1 text-blue-400"></i>Daily ATS & O/U Breakdown</h4>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-700">
                                    <tr>
                                        <th class="px-3 py-2 text-left">Date</th>
                                        <th class="px-3 py-2 text-center">Games</th>
                                        <th class="px-3 py-2 text-center">w/ Lines</th>
                                        <th class="px-3 py-2 text-center">Day ATS%</th>
                                        <th class="px-3 py-2 text-center">Day Record</th>
                                        <th class="px-3 py-2 text-center">Cum ATS%</th>
                                        <th class="px-3 py-2 text-center">Cum Record</th>
                                        <th class="px-3 py-2 text-center">Cum HC%</th>
                                        <th class="px-3 py-2 text-center">Day O/U%</th>
                                        <th class="px-3 py-2 text-center">Cum O/U%</th>
                                    </tr>
                                </thead>
                                <tbody>${dailyRows}</tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Individual Game Log -->
                    <div class="bg-gray-800/40 rounded-xl p-4 border border-gray-700">
                        <h4 class="text-sm font-bold text-white mb-3"><i class="fas fa-list mr-1 text-orange-400"></i>All Bets (${allGames.length} games)</h4>
                        <div class="max-h-96 overflow-y-auto">
                            <table class="w-full text-xs">
                                <thead class="bg-gray-700 sticky top-0">
                                    <tr>
                                        <th class="px-2 py-1 text-left">Date</th>
                                        <th class="px-2 py-1 text-left">Matchup</th>
                                        <th class="px-2 py-1 text-center">DK Line</th>
                                        <th class="px-2 py-1 text-center">Our Spread</th>
                                        <th class="px-2 py-1 text-center">Edge</th>
                                        <th class="px-2 py-1 text-center">Result</th>
                                        <th class="px-2 py-1 text-center">ATS</th>
                                        <th class="px-2 py-1 text-center">Total</th>
                                        <th class="px-2 py-1 text-center">O/U</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${history.flatMap(h => (h.games || []).map(g => {
                                        const edgeColor = g.atsEdge >= 3 ? 'text-emerald-400' : 'text-gray-400';
                                        const atsIcon = g.ourATS === 'hit' ? '<i class="fas fa-check text-emerald-400"></i>' : g.ourATS === 'miss' ? '<i class="fas fa-times text-red-400"></i>' : g.ourATS === 'push' ? '<span class="text-yellow-400">P</span>' : '<span class="text-gray-600">-</span>';
                                        const margin = g.actualMargin != null ? (g.actualMargin > 0 ? `${g.home} -${g.actualMargin}` : `${g.visitor} -${Math.abs(g.actualMargin)}`) : '-';
                                        const ouIcon = g.ourOU === 'hit' ? '<i class="fas fa-check text-violet-400"></i>' : g.ourOU === 'miss' ? '<i class="fas fa-times text-red-400"></i>' : g.ourOU === 'push' ? '<span class="text-yellow-400">P</span>' : '<span class="text-gray-600">-</span>';
                                        const totalStr = g.ourPredTotal ? `${Math.round(g.ourPredTotal)}${g.dkOverUnder ? '/' + g.dkOverUnder : ''}` : '-';
                                        return `<tr class="border-t border-gray-700/50 hover:bg-gray-700/30">
                                            <td class="px-2 py-1">${h.date}</td>
                                            <td class="px-2 py-1">${g.visitor} @ ${g.home}</td>
                                            <td class="px-2 py-1 text-center text-cyan-400">${g.dkDetails || '-'}</td>
                                            <td class="px-2 py-1 text-center">${g.ourPredWinner} ${g.ourMargin >= 0 ? '-' : '-'}${Math.abs(g.ourMargin).toFixed(1)}</td>
                                            <td class="px-2 py-1 text-center ${edgeColor}">${g.atsEdge ? g.atsEdge.toFixed(1) : '-'}</td>
                                            <td class="px-2 py-1 text-center text-gray-300">${margin}</td>
                                            <td class="px-2 py-1 text-center">${atsIcon}</td>
                                            <td class="px-2 py-1 text-center text-gray-400">${totalStr}</td>
                                            <td class="px-2 py-1 text-center">${ouIcon}</td>
                                        </tr>`;
                                    })).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
        }

        // Close modals on outside click
        document.getElementById('team-modal').addEventListener('click', e => {
            if (e.target.id === 'team-modal') closeModal();
        });
        document.getElementById('compare-modal').addEventListener('click', e => {
            if (e.target.id === 'compare-modal') closeCompareModal();
        });
        document.getElementById('matchup-modal').addEventListener('click', e => {
            if (e.target.id === 'matchup-modal') closeMatchupModal();
        });

        // Close search on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('#team-search') && !e.target.closest('#search-results')) {
                hideSearchResults();
            }
            if (!e.target.closest('#matchup-team1') && !e.target.closest('#matchup-results-1')) {
                document.getElementById('matchup-results-1')?.classList.add('hidden');
            }
            if (!e.target.closest('#matchup-team2') && !e.target.closest('#matchup-results-2')) {
                document.getElementById('matchup-results-2')?.classList.add('hidden');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeModal();
                closeCompareModal();
                closeMatchupModal();
                hideSearchResults();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('global-date').value = today;
            document.getElementById('global-date').max = today;
            await loadCoachData();
            await loadConferenceOptions();
            await loadAllTeams();
            
            // Check for URL params
            const params = new URLSearchParams(window.location.search);
            if (params.toString()) {
                loadFromURL();
            } else {
                loadRatings();
            }
        });
    </script>
</body>
</html>
